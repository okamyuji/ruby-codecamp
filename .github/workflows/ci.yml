name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # rails-ci with security-scan: false (or no rails-ci) does not run bundler-audit
  audit:
    uses: okamyuji/reusable-workflows/.github/workflows/ruby-audit.yml@v1

  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    # 中央の lockfile-recreate ジョブが Dependabot PR にコメントするため
    permissions:
      contents: read
      pull-requests: write
    with:
      # Rails アプリではないため brakeman を使わない
      security-scan: false
      dependabot-recreate: true
      lint-command: bundle exec rubocop -f github
      test-command: bundle exec rake test syntax_check execute_all docs:verify docs:check
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
